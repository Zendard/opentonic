<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View List</title>
  <link href="{url_pfx}/static/css/style.css" rel="stylesheet">
</head>

<body>
  <h1 id="list_name">...</h1>
  <h4>Users who have access:</h4>
  <div style="display:flex; gap:1rem">
    <ul id="users" class="chips"> </ul> <a href="{url_pfx}/add-user-to-list/{list_id}" id="add-user"
      class="hover button">+</a>
  </div>
  <form method="dialog" id="add_list_item">
    <input type="text" name="name" placeholder="Add an item to the list" autocapitalize="on" required>
    <button type="submit">+</button>
  </form>
  <h2>Items on list:</h2>
  <ul id="list_items" class="cards">
  </ul>
  <template id="list_item_template">
    <li>
      <button class="check-button hover"></button>
      <div>
        <h4></h4>
        <p></p>
      </div>
    </li>
  </template>


  <div id="user" class="data">{user}</div>
  <div id="url_pfx" class="data">{url_pfx}</div>
  <div id="list_id" class="data">{list_id}</div>
  <script src="{url_pfx}/static/js/fetch_list.js"></script>
</body>

</html>
