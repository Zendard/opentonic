[package]
name = "opentonic"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["json", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["fs"] }
